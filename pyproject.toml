[project]
name = "agent-witness"
version = "0.1.0"
description = "Detect when an AI agent's narrated output diverges from its own structured tool-execution audit trail. Harness-agnostic, local-first, fail-closed."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "voltagebots" }]
keywords = ["ai", "agents", "audit", "reconciliation", "narration", "hallucination", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agent-rails/agent-witness"
Repository = "https://github.com/agent-rails/agent-witness"
Issues = "https://github.com/agent-rails/agent-witness/issues"

[project.scripts]
witness = "agent_witness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "toolcall-authz>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_witness"]

[tool.setuptools.package-data]
agent_witness = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
